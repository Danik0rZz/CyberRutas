<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberRutas 2077</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: black;
      overflow: hidden;
      height: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: url('https://media.giphy.com/media/xT9IgzoKnwFNmISR8I/giphy.gif') center/cover no-repeat;
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      animation: fadeInZoom 2s ease-out forwards;
    }

    @keyframes fadeInZoom {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 3rem;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
      color: #fff;
      animation: glitch 1.5s infinite;
      text-align: center;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 red, -2px 0 blue; }
      50% { text-shadow: -2px 0 red, 2px 0 blue; }
      100% { text-shadow: 2px 0 red, -2px 0 blue; }
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    button {
      position: relative;
      padding: 20px 40px;
      font-size: 1.4rem;
      color: #0ff;
      background: black;
      border: 2px solid #0ff;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 15px #0ff, 0 0 40px #f0f;
      transition: all 0.2s ease-in-out;
      overflow: hidden;
    }

    button:hover {
      background: #0ff;
      color: #000;
      transform: scale(1.05) rotate(-1deg);
    }

    .modal {
      position: fixed;
      display: none;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(6px);
      z-index: 10;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 90%;
      height: 80%;
      background: #111;
      border: 2px solid #0ff;
      box-shadow: 0 0 30px #0ff;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 15px;
      background: #000;
      border-bottom: 1px solid #0ff;
      text-align: center;
      font-size: 1.5rem;
      color: #0ff;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 2rem;
      color: #ff00ff;
      cursor: pointer;
      z-index: 11;
    }

    .modal-body {
      flex: 1;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 CyberRutas 2077</h1>
    <div class="button-container">
      <button onclick="openModal('Casa → Dentista', 'https://www.emtmadrid.es/PMVVisor/pmv.aspx?stopnum=2838&size=4')">Casa → Dentista</button>
      <button onclick="openModal('Dentista → Casa', 'https://www.emtmadrid.es/PMVVisor/pmv.aspx?stopnum=3147&size=4')">Dentista → Casa</button>
      <button onclick="openModal('Trabajo → Casa', 'https://www.emtmadrid.es/PMVVisor/pmv.aspx?stopnum=3114&size=4')">Trabajo → Casa</button>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">⨉</span>
      <div class="modal-header" id="modalTitle">Ruta</div>
      <div class="modal-body">
        <iframe id="iframe" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    function openModal(title, url) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('iframe').src = url;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      document.getElementById('iframe').src = '';
    }
	  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js')
      .then(() => console.log('🛡️ Service Worker registrado'))
      .catch(err => console.error('Error al registrar SW:', err));
  }
  </script>
</body>
</html>
